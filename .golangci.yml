run:
  timeout: 15m
  tests: true

linters:
  enable:
    - errcheck
    - funlen
    - gocritic
    - gofmt
    - goheader
    - goimports
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unused
    - whitespace

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - staticcheck
        - unused
        - funlen
    - path: doc.go
      linters:
        - goheader
    # flag.go declares a local variable named `max`, which shadows the Go 1.21
    # builtin now that go.mod targets 1.23. Renaming it is a follow-up: flag.go
    # is held by an open PR, so the rule is excluded here until that lands.
    - path: flag\.go
      linters:
        - revive
      text: redefines-builtin-id

linters-settings:
  goheader:
    template: |-
        Use of this source code is governed by a BSD-style
        license that can be found in the LICENSE file.
