[tools]
go = "1.23"
"github:j178/prek" = "latest"
"github:golangci/golangci-lint" = "1.63.3"
"github:kyoh86/richgo" = "latest"
"go:sigs.k8s.io/mdtoc" = "v1.1.0"

[tasks.setup]
description = "Install the prek git hooks"
run = "prek install"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.check]
description = "Run every prek hook against all files"
run = "prek run --all-files"

[tasks.unittest]
description = "Run the unit test suite with race detection and coverage"
run = """
if command -v richgo >/dev/null 2>&1; then
  richgo test -failfast -v -race -cover
else
  go test -failfast -v -race -cover
fi
"""

[tasks.clean]
description = "Remove the cloned zulu checkout"
run = "rm -rf zulu"
